# 免費方案的「保持喚醒」：每 3 天呼叫一次健康檢查端點，對資料庫做一次查詢，
# 避免 Supabase 免費專案因一週未使用而暫停。
# 使用方式：在 GitHub 專案的 Settings → Secrets and variables → Actions → Variables
# 新增 APP_URL（例如 https://directory.example.org），不含結尾斜線。
name: Keep alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 "${{ vars.APP_URL }}/api/health"
